<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline &middot; NKMB Help Desk</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#1b2140;color:#fff;text-align:center;padding:24px}
  .card{max-width:420px}
  h1{font-size:1.5rem;margin:0 0 .5rem}
  p{opacity:.8;line-height:1.5}
  button{margin-top:1rem;padding:.7rem 1.6rem;border:0;border-radius:999px;background:#f17807;color:#fff;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h1>You're offline</h1>
  <p>The Help Desk needs an internet connection. Check your connection and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
