{# Runs before the page paints so there is no light/dark flash. Choice is saved by static/js/theme.js #}
<script>
(function () {
  try {
    var saved = localStorage.getItem('nkmb-theme') || localStorage.getItem('theme');   // 'theme' = older toggle
    var t = saved === 'dark' ? 'dark' : 'light';
    var d = document.documentElement;
    d.setAttribute('data-theme', t);
    d.setAttribute('data-bs-theme', t);
  } catch (e) {}
})();
</script>
